version: '3.8'
services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: "${PMA_CONTAINER_NAME:-phpmyadmin}"
    restart: always
    env_file:
      - ./.env
    environment:
      PMA_HOST: ${MYSQL_CONTAINER_NAME}
      PMA_PORT: ${MYSQL_PORT}
      PMA_ARBITRARY: 1
    ports:
      - "${PMA_PORT}:80"
    networks:
      - localnet
  tomcat:
    build: ./tomcat
    container_name: tomcat_apps
    restart: always
    env_file:
      - ./.env
    ports:
      - "8081:8080"
    volumes:
      - /var/lib/docker/volumes/sailpoint_iiq_home/_data/logs:/opt/sp_logs
      - /opt/sp_properties:/opt/sp_properties
      - /opt/CSVFiles_HRSoft:/opt/CSVFiles_HRSoft
      - /opt/CSVFiles_BI_Uploaded:/opt/CSVFiles_BI_Uploaded
    networks:
      - localnet
volumes:
  tomcat_logs:
    name: tomcat_logs
networks:
  localnet:
    external:
      name: ${NETWORK_NAME}
