version: "3.9"

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-server
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "IAMCOE Labs"
      LDAP_DOMAIN: "iamcoe.cloud"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"                # start without TLS
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ldap_certs:/container/service/slapd/assets/certs
      - ./init:/container/service/slapd/assets/config/bootstrap/ldif/custom
      # uncomment below if you want to manage certs manually in ./certs
      # - ./certs:/container/service/slapd/assets/certs:ro
    ports:
      - "1389:389"   # LDAP plain
      - "1636:636"   # LDAP over SSL (when enabled)

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - ldap

volumes:
  ldap_data:
  ldap_config:
  ldap_certs:

networks:
  localnet:
    external:
      name: ${NETWORK_NAME}